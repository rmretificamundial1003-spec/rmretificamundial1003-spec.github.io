  if ($("#mq-lista")) $("#mq-lista").innerHTML = maquinas().length ? `<table><tr><th>Máquina</th><th>Setor</th><th>Serviços</th><th>Situação</th><th></th></tr>${maquinas().map(m=>`<tr><td><b>${h(m.nome)}</b></td><td>${h(m.setor)}</td><td class="muted" style="font-size:12px">${h((m.servicos||[]).join(", ")||"todo o setor")}</td><td>${m.parada?`<b style="color:var(--bad)">⛔ Parada</b><br><span class="muted" style="font-size:12px">${dt(m.desde)} · ${h(m.motivo||"")}</span>`:`<span style="color:var(--ok)">Funcionando</span>`}</td><td class="n" style="white-space:nowrap">${m.parada?`<button class="btn sm" data-mq="${h(m.id)}" data-a="volta">✅ Voltou</button>`:`<button class="btn sm danger" data-mq="${h(m.id)}" data-a="para">⛔ Parou</button>`} <button class="btn sm" data-mq="${h(m.id)}" data-a="ed">Editar</button></td></tr>`).join("")}</table>` : `<div class="empty">Nenhuma máquina cadastrada.</div>`;
  { const lim=Date.now()-SESSAO_MAX, L=(S.sessoes||[]).filter(x=>x.ativa!==false && (x.ultimo||0)>lim && (ehDono() || x.funcId!==idDono()));
    $("#eq-ses").innerHTML = L.length ? `<div class="tbl-wrap"><table><tr><th>Pessoa</th><th>Aparelho</th><th>Desde</th><th>Último uso</th><th></th></tr>${L.map(x=>`<tr><td><b>${h(x.nome)}</b><br><span class="muted" style="font-size:12px">${h(PAPEL[x.papel]||"")}${x.email?" · "+h(x.email):""}</span></td><td>${h(x.aparelho||"—")}</td><td class="num">${dt(x.inicio)}</td><td class="num">${dt(x.ultimo)}</td><td class="n">${x.id===sesId?`<span class="muted">você</span>`:(x.papel==="chefe"&&!ehChefe()?"":`<button class="btn sm danger" data-encses="${h(x.id)}">Encerrar</button>`)}</td></tr>`).join("")}</table></div>` : `<div class="empty">Ninguém conectado agora.</div>`;
    const P=(S.pedidosSenha||[]).filter(x=>x.status==="aberto"), el=$("#eq-pedsen"); el.hidden=!P.length;
    el.innerHTML = P.length ? `<h2>🔑 Pedidos de senha</h2>${P.map(x=>`<div class="row" style="gap:8px;margin-top:6px;flex-wrap:wrap"><span style="flex:1"><b>${h(x.nome)}</b> esqueceu a senha · <span class="muted">${dt(x.em)} · ${h(x.aparelho||"")}</span></span><button class="btn sm pri" data-pedsen="${h(x.id)}">Ver senha</button><button class="btn sm" data-pedok="${h(x.id)}">Resolvido</button></div>`).join("")}` : ""; }
  { const L=caminhos(), pad=!(S.caminhosCfg&&S.caminhosCfg.lista&&S.caminhosCfg.lista.length);
    $("#cm-lista").innerHTML = (pad?`<div class="banner" style="margin:0 0 8px">Estes são caminhos sugeridos. Toque em <b>Editar</b> para deixar igual ao da sua oficina.</div>`:"") + (L.length?`<table>${L.map(c=>`<tr><td><b>${h(c.nome)}</b><br><span class="muted" style="font-size:12px">${c.tipo==="solta"?`Peça avulsa${c.peca?`: ${h(c.peca)}`:""}`:"Motor inteiro"}</span></td><td style="font-size:13px">${h(txtCaminho(c.etapas,c.aval))}</td><td class="n"><button class="btn sm" data-cm="${h(c.id)}">Editar</button></td></tr>`).join("")}</table>`:`<div class="empty">Cadastre os setores primeiro.</div>`); }
  $("#st-lista").innerHTML = S.setores.length ? S.setores.map((x,i)=>`<li><div class="row"><b style="flex:1">${h(x)}</b><span class="muted" style="font-size:13px">${S.funcionarios.filter(f=>f.setor===x&&f.ativo!==false).length} pessoa(s)</span>
    <button class="btn sm" data-a="up" data-i="${i}" aria-label="Subir" ${i?"":"disabled"}>↑</button><button class="btn sm" data-a="down" data-i="${i}" aria-label="Descer" ${i<S.setores.length-1?"":"disabled"}>↓</button><button class="btn sm danger" data-a="del" data-i="${i}">Remover</button></div></li>`).join("") : `<li class="muted" style="list-style:none;margin-left:-22px">Nenhum setor cadastrado.</li>`;
  const l = S.funcionarios.filter(f=>ehDono() || !f.dono).sort((a,b)=>(a.ativo===false)-(b.ativo===false)||a.nome.localeCompare(b.nome));
  $("#f-lista").innerHTML = `<table><tr><th>Nome</th><th>Função</th><th>Setor</th><th>Situação</th><th class="n">OS em andamento</th><th></th></tr>${l.map(f=>`<tr><td><b>${h(f.nome)}</b>${f.email?`<br><span class="muted" style="font-size:12px">${h(f.email)}</span>`:(window.__FB&&f.ativo!==false?`<br><span style="font-size:12px;color:var(--warn,#b26a00)">sem Gmail</span>`:"")}</td><td>${h(cargo(f))}</td><td>${f.papel==="funcionario"?h(setoresDe(f).join(", ")||"—"):`<span class="muted">—</span>`}</td><td>${f.ativo===false?`<span class="muted">Inativo</span>`:"Ativo"}</td>
    <td class="n">${S.os.filter(o=>o.responsavel===f.id&&["aberta","execucao","aguardando"].includes(o.status)).length}</td><td class="n" style="white-space:nowrap">${ehChefe()&&f.id!==me.id&&f.ativo!==false&&!f.dono?`<button class="btn sm" data-comoid="${f.id}">👁 Entrar como</button> `:""}${f.papel==="chefe"&&!ehChefe()?"":`<button class="btn sm" data-ed="${f.id}">Editar</button>`}${podeExcluirFunc(f)?` <button class="btn sm danger" data-exf="${f.id}">Excluir</button>`:""}</td></tr>`).join("")}</table>`;
};
function formFunc(f){
  const novo=!f; f=f||{papel:"funcionario", ativo:true};
  abrirModal(`<h2>${novo?"Cadastrar pessoa":"Editar "+h(f.nome)}</h2><form id="ff" class="form">
    <label class="f wide">Nome<input id="f-n" required maxlength="40" value="${h(f.nome)}"></label>
    <label class="f">Função<select id="f-p">${Object.entries(PAPEL).map(([k,t])=>`<option value="${k}" ${f.papel===k?"selected":""}>${t}</option>`).join("")}</select></label>
    <div class="f wide" id="f-setwrap"><span>Setores em que trabalha <span class="muted">(pode marcar vários · nenhum = ajuda em toda a oficina pelo nome)</span></span><div class="row" style="gap:6px;flex-wrap:wrap;margin-top:4px">${S.setores.map(x=>`<label class="chip" style="cursor:pointer"><input type="checkbox" class="f-sx" value="${h(x)}" ${setoresDe(f).includes(x)?"checked":""}> ${h(x)}</label>`).join("")}</div></div>
    <label class="f">Senha <span class="muted" id="f-pinreg"></span><input id="f-pin" class="pin" maxlength="8" autocomplete="off" autocapitalize="off" ${novo?"required":""} placeholder="${novo?"":"carregando…"}"></label>
    <div class="wide row" style="gap:14px">${avatar(f)}<label class="f" style="flex:1">Foto (aparece na tela de entrada)<input id="f-foto" type="file" accept="image/*" ${assets?"":"disabled"}></label></div>
    ${window.__FB?`<label class="f wide">Gmail para entrar no sistema <span class="muted">(o celular da pessoa só abre o sistema com este Gmail)</span><input id="f-em" type="email" inputmode="email" maxlength="80" autocapitalize="off" autocomplete="off" placeholder="nome@gmail.com" value="${h(f.email||"")}"></label>`:""}
    <label class="f">Situação<select id="f-a"><option value="1">Ativo</option><option value="0" ${f.ativo===false?"selected":""}>Inativo (não entra mais)</option></select></label>
    <div class="acts wide"><button type="button" class="btn" id="f-can">Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`, m=>{
    $("#f-can",m).onclick=fecharModal;
    let pinAtual = "";
    const vis=()=>{ $("#f-setwrap",m).style.display = $("#f-p",m).value==="funcionario" ? "" : "none"; $("#f-pinreg",m).textContent = senhaAdm($("#f-p",m).value) ? "(4 letras e 4 números)" : "(4 números)"; }; $("#f-p",m).onchange=vis; vis();
    if (!novo) db.doc("senhas/"+f.id).get().then(s=>{ const i=$("#f-pin",m); if(!i) return; pinAtual = s.exists ? String(s.data().pin||"") : (f.pin!=null?String(f.pin):""); i.value=pinAtual; i.placeholder = pinAtual?"":"sem senha salva · digite uma"; }).catch(()=>{ const i=$("#f-pin",m); if(i) i.placeholder="digite para trocar"; });
    $("#ff",m).onsubmit=async e=>{ e.preventDefault();
      const d={nome:$("#f-n",m).value.trim(), papel:$("#f-p",m).value, ativo:$("#f-a",m).value==="1"}; const pinNovo=$("#f-pin",m).value.trim();
      const trocaPin = !!pinNovo && pinNovo!==pinAtual; if (novo && !pinNovo){ toast("Digite a senha da pessoa."); return; }
      if (trocaPin || (pinNovo && d.papel!==f.papel)){ const er=regraSenha(d.papel, pinNovo); if (er){ toast(er); return; } }
      if (f.papel==="chefe" && !ehChefe()){ toast("Só o chefe mexe no cadastro de outro chefe."); return; }
      if (f.dono && !ehDono()){ toast("Esse cadastro não pode ser alterado."); return; } { const sx=d.papel==="funcionario" ? [...m.querySelectorAll(".f-sx:checked")].map(x=>x.value) : []; d.setores=sx; d.setor=sx[0]||""; }
      if (!novo && f.id===me.id && (d.papel!=="chefe"||!d.ativo) && f.papel==="chefe" && S.funcionarios.filter(x=>x.papel==="chefe"&&x.ativo!==false).length<2){ toast("Precisa ficar pelo menos um chefe ativo."); return; }
      if (d.papel==="chefe" && !ehChefe() && !semChefe()){ toast("Só o chefe pode cadastrar outro chefe."); return; }
      if (window.__FB){ d.email=String($("#f-em",m).value||"").trim().toLowerCase();
        if (d.email && !/^[^@\s/]+@[^@\s/]+\.[^@\s/]+$/.test(d.email)){ toast("Esse Gmail não parece certo. Confira."); return; }
        const dup = d.email && S.funcionarios.find(x=>x.id!==f.id && String(x.email||"").toLowerCase()===d.email); if (dup){ toast(`Esse Gmail já está com ${dup.nome}.`); return; } }

      const b=e.submitter; b.disabled=true;
      try{ const arq=$("#f-foto",m).files[0];
        if (arq){ if (!assets) throw {code:"sem_assets"}; const bl = await comprimir(arq); const r = await assets.upload(bl, {type:"image/jpeg"}); if (f.foto) assets.delete(f.foto).catch(()=>{}); d.foto = r.id; }
        if(novo){ d.criadoEm=Date.now(); const ref=db.collection("funcionarios").doc(); d.pinH=await gravarSenha(ref.id, d, pinNovo); await ref.set(d); auditar("Equipe", d.nome, null, Object.assign({}, d, {pin:"x"})); }
        else { const full=Object.assign({}, f, d); delete full.id; delete full.pin; if ((trocaPin || d.papel!==f.papel) && (pinNovo||pinAtual)) full.pinH=await gravarSenha(f.id, full, pinNovo||pinAtual);
          await db.doc("funcionarios/"+f.id).set(full); auditar("Equipe", d.nome, Object.assign({}, f, {pin:"a"}), Object.assign({}, full, {pin:trocaPin?"b":"a"}));
          if (!d.ativo && f.ativo!==false) for (const x of (S.sessoes||[]).filter(y=>y.funcId===f.id && y.ativa!==false)) db.doc("sessoes/"+x.id).update({ativa:false, fim:Date.now(), motivo:"inativo", encerradaPorNome:me.nome}).catch(()=>{}); }
        if (window.__FB) await window.__FB.liberar(String(f.email||"").toLowerCase(), d.email, d.ativo, {nome:d.nome, papel:d.papel, funcId:f.id||"", adm:d.papel==="chefe"||d.papel==="gerente"});
        fecharModal(); toast("Salvo"); }catch(err){ erro(err); b.disabled=false; } };
  });
}

iniciar();
})();
</script>
