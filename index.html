<style>
/* Oficina: aço frio + laranja de segurança. Barra lateral fixa, área de trabalho em cartões de dados. */
:root{
  /* Paleta da retífica: preto (principal), laranja (destaque), cinza claro só nas letras */
  --bg:#000000; --surface:#121212; --surface-2:#1e1e1e; --ink:#f4f4f4; --muted:#c4c4c4; --line:#3d3d3d;
  --accent:#ff7417; --accent-ink:#000000; --side:#000000; --side-ink:#e6e6e6;
  --ok:#4fe07c; --warn:#ffc233; --bad:#ff5252; --info:#5cb8ff;
  --ok-bg:#10261a; --warn-bg:#2b2008; --bad-bg:#2f1212; --info-bg:#0f2236;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--body)}
h1,h2,h3{font-family:var(--display);letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:21px} h3{font-size:17px}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:13px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{border-right:1px solid var(--line);background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#555 transparent}
.side::-webkit-scrollbar{width:8px}.side::-webkit-scrollbar-thumb{background:#444;border-radius:8px}.side::-webkit-scrollbar-track{background:transparent}
.side>*{flex-shrink:0}
.brand{font-family:var(--display);font-size:22px;color:var(--ink);padding:4px 10px 14px;line-height:1.1}
.proto{display:inline-block;margin-top:8px;background:var(--warn-bg);color:var(--warn);font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;padding:2px 8px;border-radius:4px}
.brand small{display:block;font-family:var(--body);font-size:12px;color:var(--side-ink);font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:6px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a:hover{background:#ffffff14;color:var(--ink)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}

function atualizar(){

  if (!novo){ if (me){ const des = id && S.funcionarios.some(f=>f.id===id && f.ativo===false); me=null; if (des){ encerrarSessao("inativo"); sessaoId=null; try{ sessionStorage.removeItem("ret-me"); }catch(e){} setTimeout(()=>toast("Seu acesso foi encerrado."),50); } } view=null; telaLogin(); return; }
  const mudouPessoa = !me || me.id!==novo.id || me.papel!==novo.papel;

        const ks=Object.keys(VIEWS).filter(k=>pode(k) && !VIEWS[k].oculto); if (me.papel==="funcionario"||me.papel==="lojista"||me.papel==="logistica") return ks.map(lk).join("");

/* ---------- PAINEL ---------- */
const SHELL = {}, BIND = {}, FILL = {};
/* ---------- SEGURANÇA: estoque, caixa e informações falsas ---------- */
const DIAS_SEG = 30;
const hashDia = iso => [...iso].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0, 7);
function pecasParaConferir(iso){
  const recentes = new Set((S.contagens||[]).filter(c=>c.dia!==iso && Date.now()-(c.em||0)<7*864e5).flatMap(c=>(c.itens||[]).map(i=>i.pecaId)));
  let L = S.pecas.filter(p=>!recentes.has(p.id)); if (L.length<5) L=S.pecas.slice();
  const h0=hashDia(iso); return L.map((p,i)=>({p, k:(hashDia(p.id+iso)^h0)>>>0})).sort((a,b)=>a.k-b.k).slice(0,5).map(x=>x.p); }
const contagemHoje = () => (S.contagens||[]).find(c=>c.dia===hojeISO());
function formContagem(){
  const iso=hojeISO(), L=pecasParaConferir(iso);
  if (!L.length){ toast("Nenhuma peça cadastrada para conferir."); return; }
  abrirModal(`<h2>🔢 Conferência do estoque · ${dia(iso)}</h2>
    <p style="margin:0">Vá até a prateleira e <b>conte</b> estas ${L.length} peças. Digite quantas tem de verdade. O sistema não mostra o número esperado: quem confere é o chefe.</p>
    <div class="grid" style="gap:8px">${L.map(p=>`<label class="f" style="margin:0"><span><b>${h(p.nome)}</b> <span class="muted mono">${h(p.codigo||"")}</span><br><span class="muted" style="font-size:12px">${h(p.aplicacao||"")}${p.local?` · ${h(p.local)}`:""}</span></span><input data-ct="${p.id}" type="number" min="0" step="1" inputmode="numeric" placeholder="Quantas tem?"></label>`).join("")}</div>
    <div class="acts"><button class="btn" id="ct-x">Cancelar</button><button class="btn pri" id="ct-ok">Registrar conferência</button></div>`, m=>{
    $("#ct-x",m).onclick=fecharModal;
    $("#ct-ok",m).onclick=async()=>{ const ins=[...m.querySelectorAll("[data-ct]")]; if (ins.some(i=>i.value.trim()==="")){ toast("Conte todas as peças da lista."); return; }
      const b=$("#ct-ok",m); b.disabled=true;
      const itens=ins.map(i=>{ const p=peca(i.dataset.ct)||{}; const c=parseInt(i.value)||0, sis=Number(p.qtd)||0; return {pecaId:p.id, nome:p.nome, codigo:p.codigo||"", contado:c, sistema:sis, dif:c-sis, custo:Number(p.custo)||0}; });
      try{ await db.doc("contagens/"+iso).set({dia:iso, itens, em:Date.now(), por:me.id, porNome:me.nome}); fecharModal(); toast("✅ Conferência registrada. Obrigado!"); }catch(err){ erro(err); b.disabled=false; } };
  });
}
const temComprov = f => /Cart(ã|a)o|Pix/i.test(f||"");
function achadosSeguranca(dias){
  const ini=Date.now()-(dias||DIAS_SEG)*864e5, A=[];
  (S.caixa||[]).forEach(c=>{ const f=c.fechamento, k=f&&f.cartao; if (k && (f.em||0)>=ini) [["débito",k.debito],["crédito",k.credito]].forEach(([n,x])=>{ if (x && Math.abs(Number(x.diferenca)||0)>=0.01) A.push({cat:"caixa", em:f.em, quem:f.porNome, grave:true, txt:`Caixa de ${dia(c.dia)}: cartão no ${n} não bateu. Sistema ${money(x.registrado)}, maquininha ${money(x.maquininha)}.${f.obs?` Explicação: ${f.obs}`:""}`}); }); });
  (S.caixa||[]).forEach(c=>{ const f=c.fechamento; if (f && (f.em||0)>=ini && Math.abs(Number(f.diferenca)||0)>=0.01) A.push({cat:"caixa", em:f.em, quem:f.porNome, txt:`Caixa de ${dia(c.dia)}: ${f.diferenca>0?"sobrou":"faltou"} ${money(Math.abs(f.diferenca))}${f.obs?` · “${f.obs}”`:" · sem explicação"}`, valor:Math.abs(f.diferenca), grave:f.diferenca<0}); });
  (S.contagens||[]).forEach(c=>{ if ((c.em||0)<ini) return; (c.itens||[]).filter(i=>i.dif).forEach(i=>A.push({cat:"contagem", em:c.em, quem:c.porNome, txt:`Conferência ${dia(c.dia)}: ${i.nome} · sistema ${i.sistema}, contado ${i.contado} (${i.dif>0?"+":""}${i.dif})`, valor:Math.abs(i.dif)*(i.custo||0), grave:i.dif<0})); });
  (S.movimentos||[]).forEach(mv=>{ if ((mv.em||0)<ini) return; const p=peca(mv.pecaId)||{};
    if (mv.tipo==="ajuste") A.push({cat:"ajuste", em:mv.em, quem:mv.porNome, txt:`Ajuste de estoque: ${mv.pecaNome} ${mv.delta>0?"+":""}${mv.delta}${mv.obs?` · ${mv.obs}`:" · sem motivo"}`, valor:Math.abs(mv.delta)*(Number(p.custo)||0), grave:mv.delta<0});
    if (mv.tipo==="entrada" && !mv.nfCompra) A.push({cat:"entrada", em:mv.em, quem:mv.porNome, txt:`Entrada sem nota do fornecedor: ${mv.delta}× ${mv.pecaNome}${mv.fornecedor?` · ${mv.fornecedor}`:""}`, valor:Number(mv.totalCompra)||0});
    if (mv.tipo==="devolucao") A.push({cat:"devolucao", em:mv.em, quem:mv.porNome, txt:`Peça voltou ao estoque: ${mv.delta}× ${mv.pecaNome}${mv.osNumero?` · OS ${codNum(mv.osNumero)}`:""}${mv.obs?` · ${mv.obs}`:""}`, valor:Math.abs(mv.delta)*(Number(p.custo)||0)}); });
  S.os.forEach(o=>{ (o.pagamentos||[]).forEach(pg=>{ if ((pg.em||0)>=ini && temComprov(pg.forma) && !pg.aut) A.push({cat:"comprov", em:pg.em, quem:pg.porNome, txt:`OS ${codOS(o)}: ${money(pg.valor)} em ${pg.forma} sem nº de autorização/comprovante`, valor:Number(pg.valor)||0}); });
    const c=o.cancelamento; if (o.status==="cancelada" && c && (c.em||0)>=ini && c.statusAntes!=="orcamento") A.push({cat:"cancel", em:c.em, quem:c.porNome, txt:`OS ${codOS(o)} cancelada depois de aprovada (${STATUS[c.statusAntes]?.t||c.statusAntes}) · ${money(c.valor||0)} · ${c.motivo}`, valor:Number(c.valor)||0, grave:(o.pagamentos||[]).length>0});
    (o.descontos||[]).forEach(d=>{ if ((d.em||0)>=ini && d.para>0) A.push({cat:"desconto", em:d.em, quem:d.porNome, txt:`Desconto na OS ${codOS(o)}: ${money(d.para)} · ${d.motivo||""} · autorizado por ${d.autorizadoPor||"—"}`, valor:Number(d.para)||0}); }); });
  S.vendas.forEach(v=>{ if ((v.em||0)<ini) return;
    if (temComprov(v.pagamento) && !v.aut) A.push({cat:"comprov", em:v.em, quem:v.porNome, txt:`Venda #${v.numero}: ${money(v.total)} em ${v.pagamento} sem nº de autorização/comprovante`, valor:Number(v.total)||0});
    if (v.desconto>0) A.push({cat:"desconto", em:v.em, quem:v.porNome, txt:`Desconto na venda #${v.numero}: ${money(v.desconto)} · ${v.descontoMotivo||""} · autorizado por ${v.descontoAutorizadoPor||"—"}`, valor:Number(v.desconto)||0});
    if (v.cancelada) A.push({cat:"cancel", em:v.canceladaEm||v.em, quem:v.canceladaPorNome||v.porNome, txt:`Venda #${v.numero} cancelada · ${money(v.total)} · ${v.motivoCancel||""}`, valor:Number(v.total)||0, grave:true}); });
  return A.sort((a,b)=>b.em-a.em); }
const CAT_SEG = {caixa:"💵 Diferença no caixa", contagem:"🔢 Conferência do estoque não bateu", ajuste:"✏️ Ajustes manuais de estoque", entrada:"📥 Entrada de peça sem nota", devolucao:"↩️ Peças que voltaram ao estoque", comprov:"🧾 Cartão/Pix sem comprovante", cancel:"❌ Cancelamentos com valor", desconto:"🏷️ Descontos dados"};
SHELL.seguranca = () => `<div class="top"><h1>🔒 Segurança</h1><span class="spacer"></span><div class="seg" id="sg-d">${[[7,"7 dias"],[30,"30 dias"],[90,"90 dias"]].map(([d,t])=>`<button type="button" data-d="${d}" class="${(UI.sgD||30)===d?"on":""}">${t}</button>`).join("")}</div></div>
  <div class="banner" style="margin:0 0 12px">Tudo o que pode esconder roubo ou informação falsa, num lugar só. Nada aqui é acusação: é o que vale a pena perguntar. Quanto mais a mesma pessoa aparece, mais atenção.</div>
  <div class="card"><h2>Por pessoa</h2><div id="sg-p" style="margin-top:8px"></div></div>
  <div id="sg-l"></div>
  <div class="card"><h2>🔢 Conferências do estoque</h2><div class="muted" style="font-size:13px">Todo dia o sistema sorteia 5 peças para o gerente contar sem ver o número esperado.</div><div id="sg-c" style="margin-top:8px"></div></div>`;
BIND.seguranca = () => { $("#sg-d").onclick=e=>{ const b=e.target.closest("[data-d]"); if(!b) return; UI.sgD=+b.dataset.d; $("#sg-d").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b)); FILL.seguranca(); }; };
FILL.seguranca = () => {
  const A=achadosSeguranca(UI.sgD||30), porQuem={};
  A.forEach(a=>{ const k=a.quem||"—"; const x=porQuem[k]=porQuem[k]||{n:0, graves:0, valor:0, cats:{}}; x.n++; if (a.grave) x.graves++; x.valor+=a.valor||0; x.cats[a.cat]=(x.cats[a.cat]||0)+1; });
  const P=Object.entries(porQuem).sort((a,b)=>b[1].graves-a[1].graves||b[1].n-a[1].n);
  $("#sg-p").innerHTML = P.length ? `<div class="tbl-wrap"><table><tr><th>Pessoa</th><th class="n">Pontos</th><th class="n">Graves</th><th class="n">Valor envolvido</th><th>Onde</th></tr>${P.map(([k,x])=>`<tr><td><b>${h(k)}</b></td><td class="n">${x.n}</td><td class="n" style="${x.graves?"color:var(--bad);font-weight:700":""}">${x.graves}</td><td class="n">${money(x.valor)}</td><td style="font-size:13px">${Object.entries(x.cats).map(([c,n])=>`${CAT_SEG[c].split(" ")[0]} ${n}`).join(" · ")}</td></tr>`).join("")}</table></div>` : `<div class="empty">Nada para olhar neste período. 👍</div>`;
  $("#sg-l").innerHTML = Object.keys(CAT_SEG).map(c=>{ const l=A.filter(a=>a.cat===c); if (!l.length) return ""; return `<details class="card" ${["caixa","contagem","cancel"].includes(c)?"open":""}><summary style="cursor:pointer"><h2 style="display:inline">${CAT_SEG[c]}</h2> <span class="pill">${l.length}</span></summary>

function totalPecas(o){ return (o.pecas||[]).reduce((s,p)=>s+(p.qtd||0)*(p.preco||0),0); }
const sQtd = x => Math.max(1, parseInt(x.qtd)||1);
const sTot = x => (Number(x.valor)||0)*sQtd(x);
const sTxt = x => `${sQtd(x)>1?sQtd(x)+"× ":""}${x.desc}`;
function totalServ(o){ return (o.servicos||[]).reduce((s,x)=>s+sTot(x),0); }
function totalOS(o){ return totalPecas(o)+totalServ(o)-(Number(o.desconto)||0); }
SHELL.os = () => `<div class="top"><h1>Ordens de serviço</h1><button class="btn" id="imp-fila">🖨 Imprimir fila</button>${gerencia()?`<button class="btn pri" id="nova-os">Nova OS</button>`:""}</div>

const atrasoOS = o => { if (!["aberta","execucao","aguardando","pronta"].includes(o.status)) return 0; const d=diasParaPrazo(o); return d!==null && d<0 ? -d : 0; };

function htmlAntigas(q){ if (!q) return ""; const ant = UI.osAntigas && UI.osAntigas.q===q ? UI.osAntigas.l : null;

    ${fi.length?`<button class="btn sm ${fi.length>=mi?"pri":""}" id="imp-novas">Imprimir as novas</button>`:""}${direcao()?`<button class="btn sm" id="imp-min">Mudar mínimo</button>`:""}</div>`;
  $("#os-st").innerHTML = [["","Todas juntas",l.length],["por","Separadas por setor",null]].map(([v,t,n])=>`<button type="button" class="chip ${UI.osEscopo===v?"on":""}" data-st="${v}">${t}${n!=null?` <b>${n}</b>`:""}</button>`).join("")

async function mudarStatus(st){
  const o = S.os.find(x=>x.id===osAberta);
  if (st==="entregue" && o && !o.notaOk){
    if (direcao()||ehLojista()) { toast("Antes de entregar, registre a nota fiscal desta OS."); formNota(o); }
    else toast("Esta OS só pode ser entregue depois que a nota fiscal for registrada.");
    return; }
  if (st==="entregue" && o){ formPagamento(o, true); return; }
  if (st==="cancelada" && o){ formCancelar(o); return; }
  if (st==="aberta" && o && o.status==="orcamento"){ formAprovacao(o, "aberta"); return; }
  try{ await patchOS(osAberta, d=>{ const ant=d.status; d.status=st; if(st==="pronta") d.prontaEm=Date.now(); if(st==="entregue") d.entregueEm=Date.now();
    addHist(d, `Situação: ${STATUS[ant]?.t} → ${STATUS[st].t}`); }); toast("Situação atualizada"); }catch(err){ erro(err); }
}
async function enviarFotos(files){ for (const f of [...files]) await enviarFoto(f); }
async function enviarFoto(file){
  const o = S.os.find(x=>x.id===osAberta);
  if (!assets){ toast("Esta conta não pode enviar fotos."); return; }
  if ((o.fotos||[]).length >= MAX_FOTOS){ toast(`Limite de ${MAX_FOTOS} fotos por OS atingido.`); return; }

  try{
    const blob = file.type==="image/gif" ? file : await comprimir(file);
    const r = await assets.upload(blob, {type: blob.type || "image/jpeg"});
    let excedeu = false;
    await patchOS(osAberta, d=>{ d.fotos=d.fotos||[]; if (d.fotos.length>=MAX_FOTOS){ excedeu=true; return; } d.fotos.push({id:r.id, em:Date.now(), por:me.id, porNome:me.nome, etapa:STATUS[d.status]?.t||""}); addHist(d,`Foto adicionada (${STATUS[d.status]?.t||""}${d.setor?" · "+d.setor:""})`); d.hist[d.hist.length-1].foto=r.id; });

  }catch(err){ erro(err); }
}

async function cancelarVenda(id, motivo, devolver, quem){
  const v=S.vendas.find(x=>x.id===id); if (!v || v.cancelada) return;
  if (devolver) for (const it of (v.itens||[])) if (peca(it.pecaId)) await mexerEstoque(it.pecaId, it.qtd, {tipo:"devolucao", vendaNumero:v.numero, obs:`Venda #${v.numero} cancelada · ${motivo}`});
  await db.doc("vendas/"+id).update({cancelada:true, cancelPendente:false, canceladaEm:Date.now(), canceladaPorNome:quem, motivoCancel:motivo, devolveuEstoque:!!devolver});
  auditar("Loja · venda cancelada", `Venda #${v.numero}`, {total:v.total}, {cancelada:true, motivo});
}

const FORMAS_NF = ["Dinheiro","Pix","Cartão de débito","Cartão de crédito","Boleto","Transferência","Cheque","A prazo (fiado)"];
const ehPrazo = f => /A prazo/i.test(f||"");
const pagosReais = l => (l||[]).filter(p=>!ehPrazo(p.forma) && (Number(p.valor)||0)>0);
function agruparPag(l){
  const m=new Map(); (l||[]).forEach(p=>{ const k=(p.forma||"Dinheiro")+"|"+(p.parcelas||1)+"|"+(p.bandeira||""); const x=m.get(k)||{forma:p.forma||"Dinheiro", valor:0, parcelas:p.parcelas||1, bandeira:p.bandeira||"", aut:[]}; x.valor=Math.round((x.valor+(Number(p.valor)||0))*100)/100; if (p.aut) x.aut.push(p.aut); m.set(k,x); });
  return [...m.values()].map(x=>({forma:x.forma, valor:x.valor, parcelas:x.forma==="Cartão de crédito"?x.parcelas:undefined, bandeira:x.bandeira||undefined, aut:x.aut.join(", ")||undefined})); }
function blocoPagNota(){
  return `<div class="wide card" style="padding:10px 12px;background:transparent"><b>💳 Pagamento (a nota sai com o que foi recebido)</b><div id="np-box" style="margin-top:6px"></div></div>`; }
/* A forma de pagamento da nota vem dos pagamentos registrados. O que ainda falta: recebe agora (vira pagamento de verdade, entra no caixa) ou fica a prazo com data. */
function ligarPagNota(m, pagos, total, vencPadrao){
  const box=$("#np-box",m); const P=pagosReais(pagos); const jaPago=Math.round(P.reduce((s,p)=>s+(Number(p.valor)||0),0)*100)/100;
  const falta=Math.max(0, Math.round((total-jaPago)*100)/100);
  let modo="agora"; const N={forma:"Dinheiro", valor:falta, aut:"", parcelas:1, bandeira:""};
  const draw=()=>{ box.innerHTML = `${P.length?agruparPag(P).map(p=>`<div class="row" style="gap:6px"><span style="color:var(--ok)">✔</span> ${h(p.forma)}${p.parcelas>1?` ${p.parcelas}x`:""} <b>${money(p.valor)}</b>${p.aut?` <span class="muted">· comprovante ${h(p.aut)}</span>`:""}<span class="spacer"></span><span class="muted" style="font-size:13px">já recebido</span></div>`).join(""):`<div class="muted" style="font-size:13px">Nenhum pagamento registrado ainda.</div>`}
    ${falta>0.009?`<div style="margin-top:8px"><b>Falta receber ${money(falta)}</b></div>
      <div class="seg" id="np-m" style="margin-top:6px;flex-wrap:wrap">${[["agora","Cliente pagou agora"],["depois","Vai pagar depois (a prazo)"]].map(([k,t])=>`<button type="button" data-k="${k}" class="${k===modo?"on":""}">${t}</button>`).join("")}</div>
      ${modo==="agora"?`<div class="row" style="gap:6px;flex-wrap:wrap;align-items:flex-end;margin-top:6px">
        <label class="f" style="flex:2;min-width:150px">Forma<select data-np="forma">${FORMAS_NF.filter(f=>!ehPrazo(f)).map(f=>`<option ${f===N.forma?"selected":""}>${f}</option>`).join("")}</select></label>
        <label class="f" style="flex:1;min-width:100px">Valor R$<input data-np="valor" inputmode="decimal" value="${String(N.valor||"").replace(".",",")}"></label>
        ${N.forma==="Cartão de crédito"?`<label class="f" style="width:90px">Parcelas<select data-np="parcelas">${Array.from({length:12},(_,k)=>`<option ${k+1==N.parcelas?"selected":""}>${k+1}</option>`).join("")}</select></label>`:""}
        ${/Cartão/.test(N.forma)?`<label class="f" style="flex:1;min-width:110px">Bandeira<select data-np="bandeira">${["","Visa","Mastercard","Elo","Hipercard","Amex","Outra"].map(b=>`<option ${b===N.bandeira?"selected":""} value="${b}">${b||"—"}</option>`).join("")}</select></label>`:""}
        ${temComprov(N.forma)?`<label class="f" style="flex:1;min-width:140px">${/Pix/.test(N.forma)?"ID do Pix ou nome de quem pagou *":"Nº de autorização (NSU) *"}<input data-np="aut" value="${h(N.aut)}" placeholder="No comprovante"></label>`:""}</div>
        <div class="muted" style="font-size:13px">Este valor entra no caixa de hoje como pagamento. Se pagou só uma parte, o resto fica a prazo.</div>`:""}
      ${modo==="depois"||(modo==="agora"&&falta-(Number(N.valor)||0)>0.009)?`<label class="f" style="margin-top:6px;max-width:220px">Vai pagar o resto até *<input type="date" id="np-venc" value="${h(vencPadrao||isoMais(7))}"></label>`:""}`
    :`<div class="muted" style="font-size:13px;margin-top:6px">✅ Tudo pago. A nota sai com estas formas.</div>`}`; };
  box.onclick=e=>{ const b=e.target.closest("#np-m [data-k]"); if(!b) return; modo=b.dataset.k; draw(); };
  box.onchange=box.oninput=e=>{ const el=e.target.closest("[data-np]"); if(!el) return; const k=el.dataset.np; const v=k==="valor"?num(el.value):k==="parcelas"?+el.value:el.value; N[k]=v;
    if (e.type==="change" && (k==="forma"||k==="valor")) draw(); };
  draw();
  return ()=>{ let novo=null;
    if (falta>0.009 && modo==="agora"){ const v=Number(N.valor)||0;
      if (!(v>0)) return {erro:"Digite quanto o cliente pagou agora, ou escolha 'Vai pagar depois'."};
      if (v>falta+0.009) return {erro:`O valor é maior do que falta receber (${money(falta)}).`};
      if (temComprov(N.forma) && !N.aut.trim()) return {erro:/Pix/.test(N.forma)?"Coloque o ID do Pix ou o nome de quem pagou.":"Coloque o nº de autorização (NSU) do comprovante."};
      novo=JSON.parse(JSON.stringify({forma:N.forma, valor:Math.round(v*100)/100, aut:temComprov(N.forma)?N.aut.trim():"", parcelas:N.forma==="Cartão de crédito"?N.parcelas:undefined, bandeira:/Cartão/.test(N.forma)?(N.bandeira||undefined):undefined})); }
    const resto=Math.round((falta-(novo?novo.valor:0))*100)/100; let venc=null;
    if (resto>0.009){ venc=$("#np-venc",m)?.value; if (!venc) return {erro:"Escolha até quando o cliente vai pagar o resto."}; }
    const nf=agruparPag(P.concat(novo?[novo]:[])); if (resto>0.009) nf.push({forma:"A prazo (fiado)", valor:resto, venc});
    return {novo, venc, resto, nf: JSON.parse(JSON.stringify(nf))}; };
}

function checarConferencia(m, total){

  const r=await fetch(url, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({acao, idToken, os})});
  let j; try{ j=await r.json(); }catch(e){ throw new Error("A ponte do Bling não respondeu direito. Confira o endereço em Notas fiscais → Bling."); }
  if (!j.ok) throw new Error(j.erro||"Erro na ponte do Bling."); return j; }

        const u = numerosUsados(v.id); if (u[tipo].has(n)){ toast(`A ${TIPO_V[tipo]} nº ${n} já está registrada na ${u[tipo].get(n)}.`); return; } }
      b.disabled=true;
      try{ const pdf = c.dis ? null : await subirPdf($("#n-pdf",m));
        await comTrava("vendas/"+v.id, async ref=>{ const s=await ref.get(); const d=JSON.parse(JSON.stringify(s.data())); if (d.notaOk) throw {code:"ja_tem_nota"};
          if (pg.novo){ const base=(d.pagamentos&&d.pagamentos.length)?d.pagamentos:[{forma:d.pagamento, valor:d.total, aut:d.aut||"", em:d.em, porNome:d.porNome}];
            if (pagosReais(base).reduce((t,p)=>t+(Number(p.valor)||0),0)+pg.novo.valor > (Number(d.total)||0)+0.009) throw {code:"pag_mudou", message:"Alguém registrou um recebimento nesta venda agora. Feche e abra de novo."};
            d.pagamentos=base.concat([Object.assign({}, pg.novo, {em:Date.now(), por:me.id, porNome:me.nome, recebimento:true})]); }
          if (pg.venc) d.vencimento=pg.venc;
          Object.assign(d, {notaOk:true, semNota:c.dis, nfTipo:tipo, nfNumero:c.dis?"":n, nfValor:c.v, nfObs:c.obs, nfPdf:pdf, nfPagamentos:c.dis?[]:pg.nf, notaEm:Date.now(), notaPor:me.id, notaPorNome:me.nome});
          await ref.set(d); });
        fecharModal(); toast(c.dis?"Venda marcada sem nota":"Nota registrada"); }catch(err){ erro(err); b.disabled=false; } };
  });
}
function cancelarNota(tipo, id){
  const ehOS = tipo==="OS", reg = ehOS ? S.os.find(o=>o.id===id) : S.vendas.find(v=>v.id===id);
  if (!reg || !reg.notaOk) return;
  if (!direcao()){ toast("Só o chefe ou o gerente pode cancelar ou trocar uma nota."); return; }
  if (reg.semNota && !ehChefe()){ toast("Só o chefe pode desfazer uma marcação de sem nota."); return; }
  abrirModal(`<h2>${reg.semNota?"Desfazer 'sem nota'":"Registrar nota cancelada"} · ${ehOS?"OS":"Venda"} ${ehOS?codOS(reg):"#"+reg.numero}</h2>
  <p style="margin:0">${reg.semNota?"A OS volta para a lista de pendentes.":"Use isto <b>depois</b> de cancelar a nota no Bling. O registro antigo fica guardado no histórico do chefe e a "+(ehOS?"OS":"venda")+" volta para a lista de pendentes, com os valores destravados."}</p>
  <form id="fc" class="grid"><label class="f">Motivo<input id="c-m" required placeholder="Ex.: valor errado, cliente pediu CNPJ"></label>
  <div class="acts"><button type="button" class="btn" id="c-x">Voltar</button><button class="btn pri danger" type="submit">Confirmar</button></div></form>`, m=>{
    $("#c-x",m).onclick=fecharModal;
    $("#fc",m).onsubmit=async e=>{ e.preventDefault(); const motivo=$("#c-m",m).value.trim(); if(!motivo) return;
      const muda = d=>{ const antigo = {nfServico:d.nfServico||"", nfPecas:d.nfPecas||"", nfTipo:d.nfTipo||"", nfNumero:d.nfNumero||"", nfValor:d.nfValor||0, nfPdf:d.nfPdf||null, nfObs:d.nfObs||"", semNota:!!d.semNota,
          notaEm:d.notaEm, notaPor:d.notaPor, notaPorNome:d.notaPorNome, canceladaEm:Date.now(), canceladaPor:me.id, canceladaPorNome:me.nome, motivo};
        d.nfCanceladas = (d.nfCanceladas||[]).concat([antigo]);
        ["nfServico","nfPecas","nfNumero","nfObs"].forEach(k=>d[k]=""); d.nfPdf=null; d.nfValor=0; d.notaOk=false; d.semNota=false; d.notaEm=null;
        return antigo; };
      try{
        if (ehOS) await patchOS(id, d=>{ const a=muda(d); addHist(d, `${a.semNota?"Marcação 'sem nota' desfeita":"Nota cancelada"}${a.nfServico?` · serviço nº ${a.nfServico}`:""}${a.nfPecas?` · NF-e nº ${a.nfPecas}`:""} · motivo: ${motivo}`); });
        else await comTrava("vendas/"+id, async ref=>{ const s=await ref.get(); const d=JSON.parse(JSON.stringify(s.data())); muda(d); await ref.set(d); });
        fecharModal(); toast("Registrado. Agora registre a nota nova."); }catch(err){ erro(err); } };
  });
}

/* ---------- FICHAS TÉCNICAS (medidas por modelo de motor) ---------- */
const GRUPOS = ["Bloco","Cabeçote","Virabrequim","Bielas","Pistões e anéis","Válvulas e comando","Torques de aperto","Outros"];
const nomeBaseOS = (o, st) => ehSolta(o) ? (o.pecaSolta||"Peça avulsa") : (o.pecasMotor&&o.pecasMotor.length) ? `Peças do motor: ${o.pecasMotor.join(" + ")}` : (PECA_DO_SETOR[st]||"Motor completo");
const ehSolta = o => !!(o && (o.tipoServico==="solta" || o.pecaSolta));
const codOS = o => o ? `${ehSolta(o)?"P":"M"}-${o.numero}` : "";
const codNum = n => { const o=(typeof S!=="undefined"&&S.os||[]).find(x=>Number(x.numero)===Number(n)); return o?codOS(o):"#"+n; };
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"");
const palavras = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/[^a-z0-9]+/).filter(Boolean);
function fichaDaOS(o){
  if (o.fichaId){ const f=S.fichas.find(x=>x.id===o.fichaId); if (f) return f; }
  const m = norm(o.motor); if (!m) return null;
  return S.fichas.find(f => [f.motor].concat(String(f.apelidos||"").split(",")).some(n => norm(n) && norm(n)===m)) || null;
}
function gruposDoSetor(setor){
  const s = norm(setor); const r = [];
  GRUPOS.forEach(g=>{ const k = norm(g.split(" ")[0]); if (k && s.includes(k)) r.push(g); });
  if (s.includes("metrolog")) return GRUPOS.filter(g=>g!=="Torques de aperto"&&g!=="Outros");
  if (s.includes("montagem") || s.includes("teste")) r.push("Torques de aperto");
  if (s.includes("cabecote")) r.push("Válvulas e comando");
  if (s.includes("bloco")) r.push("Pistões e anéis");
  return r;
}
function htmlFicha(f, setor, grande){

  const grupos = GRUPOS.filter(g => (f.itens||[]).some(i=>i.grupo===g)).sort((a,b)=>(prim.includes(a)?0:1)-(prim.includes(b)?0:1));
  return `<p class="muted" style="margin:0 0 8px">Ficha: <b>${h(f.motor)}</b>${f.fabricante?` · ${h(f.fabricante)}`:""}${f.obs?` · ${h(f.obs)}`:""}</p>` + grupos.map(g=>`
    <details ${prim.includes(g)||grupos.length<=2?"open":""} class="fgrp"><summary>${h(g)}${prim.includes(g)?` <span class="pill p-execucao">seu setor</span>`:""}</summary>

}

/* ---------- FILA E AVISOS ---------- */
const TIPOS_CLI = {contrato:"Contrato", comum:"Cliente comum"};
const tipoCli = c => (c && ["contrato","frota","garantia"].includes(c.tipo)) ? "contrato" : "comum";
const cliPriOS = o => { const c=S.clientes.find(x=>x.id===o.clienteId)||S.clientes.find(x=>x.nome===o.cliente); return !!(c&&c.prioritario); };
const tipoCliOS = o => tipoCli(S.clientes.find(x=>x.id===o.clienteId) || S.clientes.find(x=>x.nome===o.cliente));
function diasParaPrazo(o){ if (!o.previsao) return null; const hoje = new Date(hojeISO()+"T12:00"), p = new Date(o.previsao+"T12:00"); return Math.round((p-hoje)/864e5); }
/* ORDEM DA FILA (sempre nesta ordem):
   0) adiantado pelo gerente/chefe (com motivo)  1) ATRASADO (o mais atrasado primeiro)  2) entrega HOJE
   3) pelo prazo (o que vence antes primeiro; contrato e urgente ganham 2 dias)  4) sem prazo  5) PARADO esperando peça (não dá para fazer) */
function grupoFila(o){
  if (o.status==="aguardando") return 5;
  if (o.adiantadaEm) return 0;
  const d = diasParaPrazo(o);
  if (d===null) return 4;
  if (d<0) return 1;
  if (d===0) return 2;
  return 3;
}
// prazo "efetivo": contrato conta 2 dias a menos e urgente mais 2, para passar na frente sem atropelar prazos curtos
function prazoEfetivo(o){ const d = diasParaPrazo(o); if (d===null) return 99; return d - (cliPriOS(o)?3:0) - (tipoCliOS(o)==="contrato"?2:0) - (o.prioridade==="urgente"?2:0); }
function ordemFila(a,b){
  const ga = grupoFila(a), gb = grupoFila(b); if (ga!==gb) return ga-gb;
  if (ga===0) return a.adiantadaEm-b.adiantadaEm;
  if (ga!==3){ const pr=(cliPriOS(a)?0:1)-(cliPriOS(b)?0:1); if (pr) return pr; }   // ⭐ prioritário na frente dentro do mesmo grupo
  if (ga===1){ const x=diasParaPrazo(a)-diasParaPrazo(b); if (x) return x; }
  else if (ga===3){ const x=prazoEfetivo(a)-prazoEfetivo(b); if (x) return x; }
  { const pr=(cliPriOS(a)?0:1)-(cliPriOS(b)?0:1); if (pr) return pr; }
  const ct = (tipoCliOS(a)==="contrato"?0:1)-(tipoCliOS(b)==="contrato"?0:1); if (ct) return ct;
  const ex = (a.status==="execucao"?0:1)-(b.status==="execucao"?0:1); if (ex) return ex;
  return (a.setorEm||a.criadoEm||0)-(b.setorEm||b.criadoEm||0);
}
function motivoFila(o){
  const g = grupoFila(o), d = diasParaPrazo(o), r = [];
  if (g===5) return ["⏸ Parado: esperando peça chegar"];
  if (g===0) return ["⬆️ Adiantado pelo gerente"+(o.aviso&&o.aviso.txt?`: ${o.aviso.txt}`:"")].concat(d!==null&&d<0?[`ATRASADO ${-d} dia${d<-1?"s":""}`]:d===0?["Entrega HOJE"]:[]);
  if (g===2) r.push("Entrega HOJE"); else if (g===1) r.push(`ATRASADO ${-d} dia${d<-1?"s":""}`); else if (g===4) r.push("Sem prazo"); else if (d===1) r.push("Entrega amanhã"); else r.push(`Entrega em ${d} dias`);
  if (cliPriOS(o)) r.push("⭐ Cliente prioritário");
  if (tipoCliOS(o)==="contrato") r.push("Contrato");
  if (o.prioridade==="urgente") r.push("Urgente");
  return r;
}

function rastro(o){
  const gs = []; let cur = "";
  for (const e of (o.hist||[])){
    const g = cur || "Recepção / sem setor";
    if (!gs.length || gs[gs.length-1].setor!==g) gs.push({setor:g, ini:e.em, pessoas:new Map(), pecas:0, fotos:0, notas:0});
    const G = gs[gs.length-1]; G.fim = e.em;
    G.pessoas.set(e.porNome||"—", (G.pessoas.get(e.porNome||"—")||0)+1);
    const t = e.txt||"";
    if (/^Peça lançada/.test(t)) G.pecas++; else if (/^Foto adicionada/.test(t)) G.fotos++;
    else if (!/^(Situação|Setor|OS aberta|Serviço|Prazo|Dados da OS|Nota|Aviso|Adiantado|Pedido|Foto|Peça devolvida|Marcada|Desconto|Voltou|✓ Feito|Desmarcou|Medida )/.test(t) && !/remanejou|autorizou|terminou a parte|avisou:/.test(t)) G.notas++;
    const mv = t.match(/(?:Setor:|remanejou:|autorizou:)\s*.*?→\s*(.+?)(?:\s+\(sugestão|\s*·|$)/);
    if (mv) cur = mv[1].trim();
  }
  gs.forEach((g,i)=>{ g.saida = gs[i+1] ? gs[i+1].ini : null; });
  return gs;
}

function medidasDaOS(o){

const camPorId = id => id ? (caminhos().find(x=>x.id===id) || caminhosPadrao().find(x=>x.id===id) || null) : null;
function prazoSugerido(n){ const eg=g=>Array.isArray(g)?g:((g&&g.s)||[]); const csel=n.caminhoMan||n.caminhoId==="rapido"?camPorId(n.caminhoId):null; const sets = csel ? csel.etapas.flatMap(eg) : n.tipo==="solta" ? (caminhoPara("solta", n.solta==="Outra"?"":n.solta)||{etapas:[]}).etapas.flatMap(eg) : n.tipo==="pecas" ? (caminhoPara("pecas")||{etapas:[]}).etapas.flatMap(eg) : ((caminhos().find(c=>c.tipo==="motor")||{etapas:[]}).etapas.flatMap(eg));
  const P=dadosProdutividade(Date.now()-60*864e5), med=st=>{ const x=P.St.find(y=>y.nome===st); return x&&x.nt ? x.tempo/x.nt : 4*36e5; };
  let horas=0, gargalo=null; const det=[];
  sets.filter(st=>st && st!=="@servicos").forEach(st=>{ const fila=filaDoSetor(st).length, mecs=Math.max(1, S.funcionarios.filter(f=>f.ativo!==false && f.papel==="funcionario" && setoresDe(f).includes(st)).length);
    const hh = (fila+1)*med(st)/36e5/mecs; horas+=hh; det.push({st, fila, hh}); if (!gargalo || hh>gargalo.hh) gargalo={st, fila, hh}; });
  if (n.tipo!=="solta" || n.caminhoId==="rapido"){ const ja=new Set(sets); const extra=[...new Set([...(n.servs?n.servs.keys():[])].map(d=>setorDoServico(d)).filter(st=>st && !ja.has(st)))];
    if (extra.length && !n.diagnostico) extra.forEach(st=>{ const fila=filaDoSetor(st).length, mecs=Math.max(1, S.funcionarios.filter(f=>f.ativo!==false && f.papel==="funcionario" && setoresDe(f).includes(st)).length); const hh=(fila+1)*med(st)/36e5/mecs; horas+=hh; det.push({st, fila, hh}); if (!gargalo || hh>gargalo.hh) gargalo={st, fila, hh}; });
    else horas += 2*8; } // sem serviços definidos: reserva 2 dias para a usinagem depois da avaliação
  let diasUteis=Math.max(1, Math.ceil(horas/8)), d=new Date(); while (diasUteis>0){ d.setDate(d.getDate()+1); if (d.getDay()!==0) diasUteis--; }
  return {data:d.toISOString().slice(0,10), gargalo, horas:Math.round(horas)}; }

    ${(regDeb+regCre)>0?`<div class="card" style="margin:0;padding:10px 12px"><b>💳 Maquininha</b><p class="muted" style="margin:2px 0 6px;font-size:13px">Na maquininha, abra o <b>resumo / relatório de vendas de hoje</b> e digite o total de cada um. Crédito parcelado entra com o valor total da venda.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap"><label class="f" style="flex:1;min-width:130px">Total no débito R$<input id="fc-db" inputmode="decimal"></label><label class="f" style="flex:1;min-width:130px">Total no crédito R$<input id="fc-cr" inputmode="decimal"></label></div></div>`:""}

  });
}

const precisaChefe = () => !!me && me.papel!=="chefe";

const TIPO_AUT = {desconto:"Desconto na OS", preco:"Preço na tabela de serviços", pecaPreco:"Preço de peça do estoque", servValor:"Serviço com valor diferente da tabela", servRemover:"Tirar serviço da OS", servEditar:"Mudar preço de serviço na OS", reabrirCaixa:"Reabrir caixa", balcaoDesconto:"Desconto em venda na loja", ajusteEstoque:"Correção de estoque", cancelarVenda:"Cancelar venda da loja", usoInterno:"Peça para uso interno (sem OS)"};

async function aplicarAutorizacao(a){
  const P=a.payload||{}, quem=`pedido por ${a.porNome}, autorizado por ${me.nome}`;
  if (a.tipo==="cancelarVenda") await cancelarVenda(P.vendaId, `${a.motivo} · ${quem}`, !!P.devolver, me.nome);
  if (a.tipo==="usoInterno") await mexerEstoque(P.pecaId, -(Number(P.qtd)||0), {tipo:"uso interno", obs:`${a.motivo} · ${quem}`});
  if (a.tipo==="ajusteEstoque"){ const dl=(Number(P.para)||0)-(Number(P.de)||0); if (dl) await mexerEstoque(P.pecaId, dl, {tipo:"ajuste", obs:`${a.motivo} · ${quem}`}); }
  if (a.tipo==="desconto") await patchOS(P.osId, d=>{ if(d.notaOk) throw {code:"travada"}; const ant=Number(d.desconto)||0; d.desconto=P.valor; d.descontoMotivo=P.valor>0?a.motivo:""; d.descontoPorNome=P.valor>0?a.porNome:""; d.descontoEm=Date.now(); d.descontoAutorizadoPor=me.nome;
    d.descontos=(d.descontos||[]).concat([{de:ant, para:P.valor, motivo:a.motivo, em:Date.now(), por:a.por, porNome:a.porNome, autorizadoPor:me.nome}]);
    addHist(d, P.valor>0 ? `Desconto ${ant?`mudado de ${money(ant)} para`:"dado:"} ${money(P.valor)} · Motivo: ${a.motivo} · ${quem}` : `Desconto de ${money(ant)} retirado · Motivo: ${a.motivo} · ${quem}`); });
  if (a.tipo==="preco"){ const d={desc:P.desc, linha:P.linha, valor:P.valor, atualizadoEm:Date.now(), porNome:a.porNome, autorizadoPor:me.nome}; const ant=P.id&&(S.precos||[]).find(x=>x.id===P.id); if (P.id) await db.doc("precos/"+P.id).update(d); else { d.criadoEm=Date.now(); await db.collection("precos").add(d); } auditar("Tabela de preços", P.desc, ant?{valor:ant.valor}:null, {valor:P.valor}); }
  if (a.tipo==="pecaPreco"){ const pc=peca(P.pecaId); await comTrava("pecas/"+P.pecaId, ref=>ref.update({preco:P.preco, custo:P.custo, atualizadoEm:Date.now()})); auditar("Estoque · peças", (pc||{}).nome, {preco:(pc||{}).preco, custo:(pc||{}).custo}, {preco:P.preco, custo:P.custo}); }
  if (a.tipo==="servValor") await patchOS(P.osId, d=>{ if(d.notaOk) throw {code:"travada"}; d.servicos=(d.servicos||[]).concat([{desc:P.desc, valor:P.valor, qtd:P.qtd||1}]); addHist(d, `Serviço adicionado: ${(P.qtd||1)>1?P.qtd+"× ":""}${P.desc} (${money(P.valor)}, tabela ${money(P.tabela)}) · Motivo: ${a.motivo} · ${quem}`); });
  if (a.tipo==="servEditar") await patchOS(P.osId, d=>{ if(d.notaOk) throw {code:"travada"}; const x=(d.servicos||[]).find(y=>y.desc===P.desc && Number(y.valor)===Number(P.valorAntes)); if (!x) throw {code:"invalid_argument"}; x.valor=P.valor; addHist(d, `Preço do serviço ${P.desc}: ${money(P.valorAntes)} → ${money(P.valor)} cada · Motivo: ${a.motivo} · ${quem}`); });
  if (a.tipo==="servRemover") await patchOS(P.osId, d=>{ if(d.notaOk) throw {code:"travada"}; const k=(d.servicos||[]).findIndex(x=>x.desc===P.desc && Number(x.valor)===Number(P.valor)); if (k<0) throw {code:"invalid_argument"}; d.servicos.splice(k,1); addHist(d, `Serviço removido: ${P.desc} (${money(P.valor)}) · Motivo: ${a.motivo} · ${quem}`); });
}
async function decidirAutorizacao(id, aprova, motivoNeg){
  const a=(S.autorizacoes||[]).find(x=>x.id===id); if (!a || a.status!=="pendente") return;

    await db.doc("autorizacoes/"+id).update({status:aprova?"aprovado":"negado", decididoEm:Date.now(), decididoPor:me.id, decididoPorNome:me.nome, motivoNegado:motivoNeg||""});
    if (!aprova && a.osId) await patchOS(a.osId, d=>addHist(d, `Chefe negou: ${TIPO_AUT[a.tipo]} (${a.descricao})${motivoNeg?` · ${motivoNeg}`:""}`)).catch(()=>{});
    toast(aprova?"✅ Autorizado e aplicado":"Pedido negado"); }catch(err){ erro(err); }
}

const NOMES_CAMPO = {preco:"preço de venda", custo:"custo", valor:"valor", desc:"descrição", nome:"nome", telefone:"telefone", doc:"CPF/CNPJ", cidade:"cidade", tipo:"tipo", obs:"observação", motor:"motor", apelidos:"outros nomes", fabricante:"fabricante", linha:"linha", itens:"medidas", minimo:"estoque mínimo", codigo:"código", aplicacao:"aplicação", local:"local", medidas:"medidas", papel:"cargo", setor:"setor", ativo:"ativo", pin:"senha", lista:"lista", setores:"checklists", minImprimir:"mínimo para imprimir", garantiaDias:"dias de garantia", marca:"marca", unidade:"unidade"};
const fmtV = v => v==null||v==="" ? "—" : typeof v==="object" ? (Array.isArray(v)?`${v.length} ite${v.length===1?"m":"ns"}`:"(lista)") : String(v);
async function auditar(area, nome, antes, depois){ if (ehDono()) return;
  try{ const a=antes||{}, d=depois||{}, mud=[];
    new Set(Object.keys(a).concat(Object.keys(d))).forEach(k=>{ if (/^(atualizadoEm|criadoEm|atualizadoPorNome|porNome|foto|qtd)$/.test(k)) return;
      if (JSON.stringify(a[k]??null)!==JSON.stringify(d[k]??null)) mud.push({campo:NOMES_CAMPO[k]||k, de:k==="pin"?"••••":fmtV(a[k]), para:k==="pin"?"(nova senha)":fmtV(d[k]), detalheDe:k==="pin"?null:(typeof a[k]==="object"?a[k]:null), detalhePara:k==="pin"?null:(typeof d[k]==="object"?d[k]:null)}); });
    if (!mud.length && antes && depois) return;
    await db.collection("auditoria").add({area, nome, acao: !antes?"criou":!depois?"apagou":"mudou", mud, em:Date.now(), por:me?me.id:"", porNome:me?me.nome:"", papel:me?me.papel:""});
  }catch(e){ console.error("auditoria", e); }
}

/* =================== CÓPIA DE SEGURANÇA (backup) =================== */
const COLS_BK = ["contasPagar","avisosChefe","maquininha","funcionarios","clientes","os","pecas","vendas","movimentos","fichas","compras","precos","caixa","autorizacoes","despesas","auditoria","acessos","reclamacoes","contagens","comprasFeitas","banco","conferencias","lixeira","senhas","config"];
const b64e = u8 => { let t=""; for (let i=0;i<u8.length;i+=0x8000) t+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(t); };
const b64d = t => Uint8Array.from(atob(t), c=>c.charCodeAt(0));
async function chaveCopia(senha, salt){ const k=await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]); return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]); }
async function cifrarCopia(txt, senha){ const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM", iv}, await chaveCopia(senha,salt), new TextEncoder().encode(txt)));
  return JSON.stringify({app:"retifica", v:2, cifrado:true, geradoEm:new Date().toISOString(), salt:b64e(salt), iv:b64e(iv), dados:b64e(ct)}); }
async function decifrarCopia(obj, senha){ const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv:b64d(obj.iv)}, await chaveCopia(senha, b64d(obj.salt)), b64d(obj.dados)); return JSON.parse(new TextDecoder().decode(pt)); }
async function gerarCopia(completa, aviso){
  const cols = COLS_BK.concat(completa && window.__FB ? ["arquivos","arquivosPartes"] : []), out={app:"retifica", v:2, geradoEm:new Date().toISOString(), geradoPor:me.nome, completa:!!(completa && window.__FB), cols:{}};
  for (const c of cols){ if (aviso) aviso(`Juntando ${c}…`); try{ const r=await db.collection(c).get(); out.cols[c]=r.docs.map(d=>Object.assign({_id:d.id}, d.data())); }catch(e){ out.cols[c]=[]; console.error("copia", c, e); } }
  return out; }
async function salvarArquivoCopia(nome, txt, ondeDrive, tokP){
  if (ondeDrive && window.__FB && window.__FB.salvarDrive){ await window.__FB.salvarDrive(nome, txt, tokP); return "drive"; }
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if (!dl) throw {code:"sem_download"}; await dl.save({filename:nome, data:txt, mimeType:"application/json"}); return "aparelho"; }
function baixarBackup(){ formCopia(); }

      <div class="acts wide"><button type="button" class="btn" id="cp-c">Cancelar</button>${drive?`<button type="submit" class="btn" data-onde="aparelho">⬇️ Baixar no aparelho</button><button type="submit" class="btn pri" data-onde="drive">☁️ Salvar no Google Drive</button>`:`<button type="submit" class="btn pri" data-onde="aparelho">⬇️ Baixar cópia</button>`}</div></form>`, m=>{

async function mostrarCopia(m, dados){

    $("#rs-ql",m).onclick=e=>{ const b=e.target.closest("[data-rsi]"); if(!b) return; const [c,x]=L[+b.dataset.rsi]; const existe=atuais[c]&&atuais[c].has(x._id);

      ${o.qtdPecas?`<b>Veio no motor:</b> ${h(txtPecasMotor(o))}<br>`:""}<b>Onde está:</b> ${h(ondeEsta(o)||o.setor||"—")}<br>

  clientes: {t:"Clientes", f:()=>tb(["Nome","Telefone / WhatsApp","CPF/CNPJ","Cidade","OS"], S.clientes.slice().sort((a,b)=>String(a.nome).localeCompare(b.nome)).map(c=>[h(c.nome),h(c.telefone||""),h(c.doc||""),h(c.cidade||""),String(S.os.filter(o=>o.clienteId===c.id).length)]))},
  receber: {t:"Contas a receber", f:()=>{ const L=devendo().sort((a,b)=>(a.vencimento||"9")<(b.vencimento||"9")?-1:1); return tb(["OS","Cliente","Telefone","Vencimento","Total","Pago","Falta"], L.map(o=>[h(codOS(o)),h(o.cliente||""),h(o.telefone||""),(vencida(o)?"<b>VENCIDA</b> ":"")+h(o.vencimento?dia(o.vencimento):"—"),money(totalOS(o)),money(pagoOS(o)),`<b>${money(faltaPagar(o))}</b>`])) + `<p><b>Total a receber: ${money(L.reduce((t,o)=>t+faltaPagar(o),0))}</b></p>`; }},
  estoque: {t:"Estoque de peças", f:()=>tb(["Código","Peça","Local","Qtd","Mín.","Valor"], S.pecas.slice().sort((a,b)=>String(a.nome).localeCompare(b.nome)).map(p=>[h(p.codigo||""),h(p.nome||""),h(p.local||""),String(p.qtd||0),String(p.minimo||0),money(p.preco||0)]))},
  equipe: {t:"Equipe e setores", f:()=>tb(["Nome","Função","Setores","Situação"], S.funcionarios.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(f=>[h(f.nome),h(PAPEL[f.papel]||f.papel),h(setoresDe(f).join(", ")||"—"),f.ativo===false?"Inativo":"Ativo"]))},
  precos: {t:"Tabela de preços", f:()=>tb(["Serviço","Setor","Linha","Valor"], S.precos.slice().sort((a,b)=>String(a.setor||"").localeCompare(b.setor||"")||String(a.desc).localeCompare(b.desc)).map(p=>[h(p.desc),h(p.setor||"—"),h(p.linha||""),money(p.valor||0)]))}
};

function termoAprovacao(o, valor, prazo){ return `Autorizo a ${nomeEmp()} a executar os serviços da OS ${o.numero?("nº "+o.numero):""} no motor/peça ${o.motor||""}${o.numMotor?" (nº "+o.numMotor+")":""}, no valor de ${money(valor)}${prazo?`, com previsão de entrega em ${dia(prazo)}`:""}. Estou ciente de que: peças trocadas ficam à minha disposição; se, ao desmontar, aparecer outro defeito, a retífica me avisa e só faz o serviço extra com a minha nova aprovação; e o motor/peça pronto deve ser retirado em até 90 dias.`; }
function padAssinatura(box){
  box.innerHTML=`<div style="position:relative;background:#fff;border-radius:10px;border:2px dashed #999;touch-action:none"><canvas style="display:block;width:100%;height:170px;touch-action:none;cursor:crosshair"></canvas><div class="as-ph" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;pointer-events:none;font-size:15px">✍️ Assine aqui com o dedo</div><div style="position:absolute;left:12px;right:12px;bottom:28px;border-bottom:1px solid #bbb;pointer-events:none"></div></div><div class="row" style="margin-top:4px"><span class="spacer"></span><button type="button" class="btn sm as-lp">Limpar</button></div>`;
  const cv=box.querySelector("canvas"), ph=box.querySelector(".as-ph"); let ctx, desenhou=false, ult=null, minX=1e9,minY=1e9,maxX=0,maxY=0;
  const ajusta=()=>{ const r=cv.getBoundingClientRect(), k=window.devicePixelRatio||1; cv.width=Math.max(1,r.width*k); cv.height=Math.max(1,r.height*k); ctx=cv.getContext("2d"); ctx.scale(k,k); ctx.lineWidth=2.6; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#111"; };
  setTimeout(ajusta, 30); try{ new ResizeObserver(()=>{ if (!desenhou) ajusta(); }).observe(cv); }catch(e){}
  const pos=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  cv.addEventListener("pointerdown", e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); { const r=cv.getBoundingClientRect(); if (!ctx || Math.abs(cv.width-r.width*(window.devicePixelRatio||1))>2) ajusta(); } ult=pos(e); ctx.beginPath(); ctx.arc(ult.x, ult.y, 1.2, 0, 7); ctx.fill(); });
  cv.addEventListener("pointermove", e=>{ if (!ult) return; e.preventDefault(); const p=pos(e); ctx.beginPath(); ctx.moveTo(ult.x,ult.y); ctx.lineTo(p.x,p.y); ctx.stroke(); ult=p; desenhou=true; ph.style.display="none"; minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
  const fim=()=>{ ult=null; }; cv.addEventListener("pointerup", fim); cv.addEventListener("pointercancel", fim); cv.addEventListener("pointerleave", fim);
  box.querySelector(".as-lp").onclick=()=>{ ajusta(); desenhou=false; ph.style.display="flex"; minX=minY=1e9; maxX=maxY=0; };
  return { vazio:()=>!desenhou || (maxX-minX<25 && maxY-minY<12),
    png:()=>{ const k=window.devicePixelRatio||1, pad=8, x0=Math.max(0,(minX-pad)*k), y0=Math.max(0,(minY-pad)*k), w=Math.min(cv.width-x0,(maxX-minX+2*pad)*k), hh=Math.min(cv.height-y0,(maxY-minY+2*pad)*k);
      const esc=Math.min(1, 500/w, 160/hh), o=document.createElement("canvas"); o.width=Math.round(w*esc); o.height=Math.round(hh*esc); o.getContext("2d").drawImage(cv, x0,y0,w,hh, 0,0,o.width,o.height); return o.toDataURL("image/png"); } };
}

  <div id="as-pad"></div><div class="form" style="margin-top:6px"><label class="f">Nome de quem assina<input id="as-n"></label><label class="f">CPF de quem assina (opcional)<input id="as-d" inputmode="numeric"></label></div></div>

/* ASSINATURA PELO WHATSAPP: o sistema cria um link de uso único (vale 7 dias). O cliente abre no celular dele, lê o termo e assina com o dedo.
   A página do link fica na "ponte" (Google Apps Script da retífica), que grava a assinatura direto na OS. O cliente não precisa de senha nem de Gmail. */
const ponteUrl = () => blingUrl();
function novoToken(){ const a=new Uint8Array(24), L="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789"; crypto.getRandomValues(a); return [...a].map(b=>L[b%L.length]).join(""); }
/* cria o link de uso único (7 dias). aprovar=true: o cliente está APROVANDO o orçamento (não só assinando o que já aprovou). */
async function criarPedidoAssinatura(o, tk, aprovar){
  const v=aprovar?totalOS(o):(valorAprovado(o)!=null?valorAprovado(o):totalOS(o)), agora=Date.now();
  await db.doc("assinaturasPendentes/"+tk).set({osId:o.id, numero:o.numero, codigo:codOS(o), cliente:String(o.cliente||"").split(" ")[0], motor:o.motor||"", valor:v, aprovar:!!aprovar,
    servicos:(o.servicos||[]).map(x=>sTxt(x)+": "+money(sTot(x))).slice(0,25), pecas:(o.pecas||[]).map(x=>x.qtd+"× "+x.nome+": "+money(x.qtd*x.preco)).slice(0,25), previsao:o.previsao||"", termo:termoAprovacao(o, v, o.previsao), empresa:nomeEmp(), criadoEm:agora, expira:agora+7*864e5, porNome:me.nome, usado:false});
  await patchOS(o.id, d=>{ d.assinaturaPedido={token:tk, em:agora, porNome:me.nome, aprovar:!!aprovar, valor:v}; addHist(d, `📲 Link para o cliente ${aprovar?"aprovar e assinar o orçamento":"assinar"} enviado por ${me.nome}`); });
}

      <button class="btn" id="az-cp" style="justify-content:center">📋 Copiar mensagem com o link</button></div>
    <p class="muted" style="font-size:12px;margin:0">O link só funciona uma vez e vence em 7 dias. Se precisar, gere outro.</p>

/* SITUAÇÃO DA ASSINATURA, bem clara para o atendente */
function estadoAss(o){
  const ar=o.aprovacaoRemota, pd=o.assinaturaPedido, a=assinaturaOS(o), ag=Date.now();
  if (ar && !ar.lancada && o.status==="orcamento") return {k:"aprovou", t:"✅ Cliente aprovou o orçamento", cl:"p-pronta", s:`${ar.nome} · ${dt(ar.em)}`};
  if (pd && !(a && (a.em||0)>=pd.em) && !(ar && (ar.em||0)>=pd.em)){
    if (pd.em+7*864e5 < ag) return {k:"vencido", t:"⌛ Link vencido · mandar outro", cl:"p-cancelada", s:`enviado ${dt(pd.em)}`};
    const hrs=Math.floor((ag-pd.em)/36e5), tempo=hrs<1?"agora há pouco":hrs<24?`há ${hrs}h`:`há ${Math.floor(hrs/24)} dia${hrs>=48?"s":""}`;
    return {k:"esperando", t:`⏳ Esperando o cliente assinar · ${tempo}`, cl:"p-aguardando", s:`link enviado ${dt(pd.em)} por ${pd.porNome||""}`, atraso:hrs>=48};
  }
  if (a) return {k:"assinou", t:"✍️ Cliente assinou", cl:"p-pronta", s:`${a.nome} · ${dt(a.em)}`};
  if (o.status==="orcamento") return {k:"nao", t:"✉️ Cliente ainda não aprovou", cl:"", s:"nenhum link de aprovação enviado"};
  return null;
}

  return e.cl ? ` <span class="pill ${e.cl}" title="${h(e.s)}">${h(e.t)}</span>` : ` <span class="muted" style="font-size:12px" title="${h(e.s)}">${h(e.t)}</span>`; }

        fecharModal(); const lancou = depois==="aberta"&&o.status==="orcamento";

        else toast(lancou?"✅ OS lançada · foi para o gerente liberar":"✅ Aprovação registrada"); }catch(err){ erro(err); b.disabled=false; } };
  });
}
function htmlAprovacao(o){
  const va=valorAprovado(o), t=totalOS(o); if (o.status==="orcamento" && va==null) return "";
  if (va==null) return `<div class="banner warn" style="margin:8px 0 0;font-size:13px">Sem valor aprovado registrado. <a href="#" data-aprov="1">Registrar aprovação</a></div>`;
  const a=o.aprovacoes[o.aprovacoes.length-1], dif=Math.round((t-va)*100)/100;
  return `<div style="margin-top:8px;font-size:13px"><span class="muted">Aprovado pelo cliente:</span> <b>${money(va)}</b> <span class="muted">(${h(a.como)} · ${h(a.quem)} · ${dt(a.em)})</span></div>
`;
}

/* ---- OS antigas (fora das 1.000 mais recentes) ---- */
async function buscarOSAntigas(q){
  q=String(q||"").trim(); if (!q) return [];
  const minNum = S.os.reduce((m,o)=>Math.min(m, Number(o.numero)||Infinity), Infinity);
  const col=db.collection("os"), achou=new Map(), add=r=>r.docs.forEach(d=>{ const x=Object.assign({id:d.id}, d.data()); if (!S.os.some(o=>o.id===x.id)) achou.set(d.id, x); });
  const n=parseInt(q,10), tarefas=[];
  if (String(n)===q) tarefas.push(col.where("numero","==",n).limit(5).get());
  tarefas.push(col.where("numMotor","==",q.toUpperCase()).limit(50).get());
  tarefas.push(col.where("cliente","==",q).limit(200).get());
  const c=S.clientes.find(x=>norm(x.nome)===norm(q)); if (c) tarefas.push(col.where("clienteId","==",c.id).limit(200).get());
  if (S.os.length>=1000 && isFinite(minNum)) tarefas.push(col.where("numero","<",minNum).orderBy("numero","desc").limit(300).get());
  (await Promise.allSettled(tarefas)).forEach(r=>{ if (r.status==="fulfilled") add(r.value); });
  const nq=norm(q); return [...achou.values()].filter(o=>norm([o.numero,codOS(o),o.cliente,o.motor,o.numMotor,o.placa].join(" ")).includes(nq)).sort((a,b)=>b.numero-a.numero);
}

/* ---- veículos e versões de motor (lista inicial; o sistema também aprende com as OS lançadas) ---- */
const VEIC = []; /* sem lista pronta: o sistema aprende os veículos e motores com o que a equipe digita nas OS */
const nz = x => norm(x).replace(/[\s\-./]/g,"");
const veicTodos = () => { const ap=(S.veicCfg&&S.veicCfg.lista)||[]; const L=VEIC.map(v=>[v[0],v[1],v[2],v[3].slice()]);
  ap.forEach(a=>{ const ex=L.find(v=>nz(v[1])===nz(a.modelo)); if (ex){ (a.motores||[]).forEach(m=>{ if(!ex[3].some(x=>nz(x)===nz(m))) ex[3].push(m); }); } else L.push([a.marca||"",a.modelo,a.linha||"leve",(a.motores||[]).slice()]); }); return L; };
function veicAchar(txt){ const t=nz(txt); if (t.length<2) return null; const L=veicTodos();
  const partes = v => [v[1], ...String(v[1]).split("/")].map(nz).filter(x=>x.length>=2);
  return L.find(v=>t===nz(v[0]+v[1]) || t===nz(v[1])) || L.find(v=>partes(v).some(p=>t.includes(p))) || L.find(v=>nz(v[0]+v[1]).includes(t)) || null; }
async function aprenderVeiculo(veiculo, motor, linha){
  if (!veiculo || !motor || !db) return; const v=veicAchar(veiculo); if (v && v[3].some(m=>nz(m)===nz(motor))) return;
  try{ const cur=(S.veicCfg&&S.veicCfg.lista)||[]; const modelo = v ? v[1] : veiculo.trim(); const ex=cur.find(a=>nz(a.modelo)===nz(modelo));
    const lista = ex ? cur.map(a=>a===ex?{...a, motores:[...(a.motores||[]), motor.trim()]}:a) : [...cur, {marca:v?v[0]:"", modelo, linha:linha||(v?v[2]:"leve"), motores:[motor.trim()], em:Date.now(), porNome:me.nome}];
    await db.doc("config/veiculos").set({lista, atualizadoEm:Date.now()}); }catch(e){} }
function motoresDoVeiculo(txt){
  const v=veicAchar(txt), lista=v?v[3].slice():[], t=norm(txt);
  // aprende com as OS já lançadas
  if (t.length>=2) S.os.forEach(o=>{ const ov=norm(o.veiculo||""); if (o.motor && ov && (ov.includes(v?norm(v[1]):t) || t.includes(ov)) && !lista.some(m=>nz(m)===nz(o.motor))) lista.push(o.motor); });
  return {v, lista};
}
/* Pesquisa automática dos motores de um veículo (Claude) + botão para conferir no Google. O resultado fica salvo em config/veiculos. */
const PESQ_MOT = {}; // nz(veiculo) -> {st:"buscando"|"ok"|"nada"|"erro", lista:[]}
const googleMotor = v => "https://www.google.com/search?q="+encodeURIComponent(`motor do ${v} versões`);
async function pesquisarMotores(veiculo, depois){
  const k=nz(veiculo); if (k.length<3 || PESQ_MOT[k]) return; PESQ_MOT[k]={st:"buscando", lista:[]}; depois&&depois();
  try{ const sm=await iaPegar(); if (!sm || !sm.json) throw {code:"sem_ia"};
    const r = await sm.json(`Você é especialista em motores de veículos vendidos no Brasil (carros, pickups, vans, caminhões, ônibus, tratores, máquinas).
O funcionário de uma retífica digitou o veículo: "${veiculo.replace(/"/g,"'")}".
Responda SÓ com JSON neste formato: {"marca":"","modelo":"","linha":"leve" ou "pesada","motores":["..."]}
- "modelo": o nome do modelo, curto (ex.: "Kwid", "Gol", "Atego 1719").
- "motores": os motores que equiparam esse modelo no Brasil, do mais comum para o menos comum, no máximo 6. Escreva como a retífica conhece: família/código + cilindrada + válvulas quando fizer sentido (ex.: "EA111 1.0 8V", "AP 1.6 8V", "SCe 1.0 12V", "OM 924 LA", "MWM 4.10 TCA", "Cummins ISF 2.8").
- "linha": "pesada" para caminhão, ônibus, trator e máquina; senão "leve".
- Se não tiver certeza de qual veículo é, devolva "motores": [].`, {modelTier:"default"});
    const motores=[...new Set(((r&&r.motores)||[]).map(x=>String(x).trim()).filter(Boolean))].slice(0,6);
    if (!motores.length){ PESQ_MOT[k]={st:"nada", lista:[]}; depois&&depois(); return; }
    PESQ_MOT[k]={st:"ok", lista:motores, marca:r.marca||"", modelo:r.modelo||veiculo.trim()};
    try{ const cur=(S.veicCfg&&S.veicCfg.lista)||[]; const modelo=String(r.modelo||veiculo).trim(); const ex=cur.find(a=>nz(a.modelo)===nz(modelo));
      const lista = ex ? cur.map(a=>a===ex?{...a, motores:[...new Set([...(a.motores||[]), ...motores])]}:a) : [...cur, {marca:r.marca||"", modelo, linha:r.linha==="pesada"?"pesada":"leve", motores, em:Date.now(), porNome:me.nome, fonte:"pesquisa"}];
      S.veicCfg = Object.assign({}, S.veicCfg||{}, {lista}); await db.doc("config/veiculos").set({lista, atualizadoEm:Date.now()}); }catch(e){}
  }catch(e){ PESQ_MOT[k]={st:"erro", lista:[]}; }
  depois&&depois();
}

function maskMaiusc(el){ if (!el) return; el.style.textTransform="uppercase"; el.autocapitalize="characters"; el.addEventListener("input", ()=>{ const p=el.selectionStart; const v=el.value.toUpperCase(); if (v!==el.value){ el.value=v; try{ el.setSelectionRange(p,p); }catch(e){} } }); }

    <div style="font-size:16px">${h(c.nome)} · ${h(o.motor)} · <b>${money(totalOS(o))}</b></div>
    <div class="muted">${o.status==="orcamento"?"Ainda <b>não foi lançado</b> na oficina. Mande para o cliente. Quando ele aprovar, vá em <b>Minhas OS</b> e toque em <b>✅ Aprovou · Lançar</b>.":(o.setor?`Lançada e já está na tela do mecânico (${h(o.setor)}).`:"Lançada. Toque em <b>🔧 Mandar para a oficina</b> na OS, ou o gerente manda.")}</div>
    <div class="grid" style="gap:8px">
      ${wa?`<a class="btn ${o.status==="orcamento"?"pri":""}" style="justify-content:center" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msgWhats(o,o.status==="orcamento"?"orcamento":"os"))}">💬 ${o.status==="orcamento"?"Mandar orçamento":"Mandar a OS"} no WhatsApp</a>`:`<div class="banner warn" style="margin:0">Cliente sem telefone: não dá para mandar no WhatsApp.</div>`}
      ${o.entrada?`<button class="btn" id="sx-ent" style="justify-content:center">🖨 Imprimir ficha de entrada para o cliente assinar</button>`:""}
      <button class="btn" id="sx-ver" style="justify-content:center">Ver a OS</button></div>
    <div class="acts"><button class="btn pri" id="sx-ok">Fechar</button></div>`, m=>{
    const fim=(ver)=>{ fecharModal(); if (ver){ location.hash = ehLojista()?"lojas":"os"; setTimeout(()=>abrirOS(o.id),50); } else { location.hash = ehLojista()?"lojas":"os"; } };
    $("#sx-ok",m).onclick=()=>fim(false); $("#sx-ver",m).onclick=()=>fim(true);
    const e=$("#sx-ent",m); if (e) e.onclick=()=>folhaParaImprimir("Ficha de entrada · OS #"+o.numero, `ficha-entrada-os-${o.numero}.html`, htmlEntradaImp(o));
    $("#sx-etq",m).onclick=()=>imprimirEtiqueta(o);
    { const ep=$("#sx-etqp",m); if (ep) ep.onclick=()=>imprimirEtiquetasPecas(o); }
  });
}

function reduzirImagem(file, max=320){ return new Promise((ok,ruim)=>{ const fr=new FileReader(); fr.onerror=ruim; fr.onload=()=>{ const im=new Image(); im.onerror=()=>ruim(new Error("Imagem inválida")); im.onload=()=>{ const k=Math.min(1, max/Math.max(im.width,im.height)); const c=document.createElement("canvas"); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext("2d").drawImage(im,0,0,c.width,c.height); let u=c.toDataURL("image/png"); if (u.length>300000) u=c.toDataURL("image/jpeg",0.85); ok(u); }; im.src=fr.result; }; fr.readAsDataURL(file); }); }

function adicionaisOS(o){ // o que entrou depois da última aprovação
  const a=(o.aprovacoes||[]).slice(-1)[0]; if (!a) return {itens:[], antes:null};
  const it=[]; (o.servicos||[]).forEach(s=>{ const b=(a.servicos||[]).find(x=>x.desc===s.desc); const qa=b?(b.qtd||1):0; if (sQtd(s)>qa) it.push(`${sQtd(s)-qa>1||qa?(sQtd(s)-qa)+"× ":""}${s.desc}: ${money(s.valor*(sQtd(s)-qa))}`); });
  (o.pecas||[]).forEach(p=>{ const b=(a.pecas||[]).find(x=>x.nome===p.nome); const qa=b?b.qtd:0; if (p.qtd>qa) it.push(`${p.qtd-qa}× ${p.nome}: ${money(p.preco*(p.qtd-qa))}`); });
  return {itens:it, antes:a.valor};
}
const precisaReaprovar = o => { const va=valorAprovado(o); return va!=null && totalOS(o)-va>0.005 && !["entregue","cancelada"].includes(o.status); };
function etapasOS(o){
  const ap=(o.aprovacoes||[])[0], H=t=>(o.hist||[]).find(e=>(e.txt||"").includes(t));
  const set = o.setorEm || (H("Setor:")||{}).em;
  return [
    {t:"Orçamento salvo", quem:fnome(o.criadoPor)!=="—"?fnome(o.criadoPor):((o.hist||[])[0]||{}).porNome, em:o.criadoEm, ok:true},
    {t:"Aprovou · OS lançada", quem:ap&&ap.porNome, em:ap&&ap.em, ok:!!ap || o.status!=="orcamento"},
    {t:"Gerente liberou", quem:o.liberadaPorNome, em:o.liberadaEm||set, ok:liberada(o)},
    {t:"Na oficina", quem:o.responsavel?fnome(o.responsavel):"", em:(H("Em execução")||{}).em, ok:["execucao","aguardando","pronta","entregue"].includes(o.status)},
    {t:"Pronto", quem:(H("→ Pronta")||{}).porNome, em:o.prontaEm, ok:["pronta","entregue"].includes(o.status)},
    {t:"Cliente avisado", quem:o.clienteAvisadoPorNome, em:o.clienteAvisadoEm, ok:!!o.clienteAvisadoEm || o.status==="entregue"},
    {t:"Entregue", quem:o.retirada&&o.retirada.nome?`levou: ${o.retirada.nome}`:"", em:o.entregueEm, ok:o.status==="entregue"}];
}

}
/* posição na fila de cada setor, para a loja saber onde está a OS sem ligar para a oficina */
function filaDoSetor(st){ const L=[]; S.os.filter(o=>["aberta","execucao","aguardando"].includes(o.status) && !esperaRemanejar(o)).forEach(o=>{
    if (o.frentes&&o.frentes.length) o.frentes.forEach(f=>{ if (f.setor===st && f.st!=="feito") L.push(vistaFrente(o,f)); });
    else if (o.setor===st) L.push(o); }); return L.sort(ordemFila); }
function ondeEsta(o){
  if (o.status==="orcamento") return o.aguardaAprov ? "📏 Avaliação feita · esperando o cliente aprovar" : "Orçamento · esperando o cliente aprovar";
  if (!["aberta","execucao","aguardando"].includes(o.status)) return "";
  const pos = (st, fid) => { const L=filaDoSetor(st); const i=L.findIndex(x=>x.id===o.id && (!fid || x._fid===fid)); return i<0?"":(i===0?(o.status==="execucao"?"fazendo agora":"é o próximo"):`${i+1}º na fila`); };
  if (o.frentes && o.frentes.length) return o.frentes.map(f=>`${codFrente(o,f)} ${f.peca}: ${f.st==="feito"?"✓ pronto":`${f.setor} (${pos(f.setor,f.id)})`}`).join(" · ");
  if (!o.setor) return "Esperando ir para a oficina";
  return `${o.setor} · ${pos(o.setor)}${o.status==="aguardando"?" · parado esperando peça":""}`;
}

function pendLojista(){ const l=osDoLojista();

function pecasDoMotor(o){
  const toks = palavras([o.motor, o.veiculo].join(" ")).filter(t=>(t.length>=2||/\d/.test(t)) && !["de","do","da","com","motor","peca","solta"].includes(t));
  const linhaOk = p => !p.linha || p.linha==="ambas" || p.linha===o.linha;
  return S.pecas.filter(linhaOk).map(p=>{ const alvo=norm([p.aplicacao,p.nome,p.codigo].join(" ")); return {p, sc:toks.reduce((s,t)=>s+(alvo.includes(t)?(t.length>=3?2:1):0),0)}; })

/* ===================== CONFERÊNCIA COM O BANCO (só chefe) =====================

const FORMA_BANCO = f => /pix|transfer|ted|doc|boleto|dep[oó]sito/i.test(f||"");

function pagamentosParaConferir(){ const L=[];

    pagosReais(pg).forEach((p,i)=>L.push({k:`vd:${v.id}:${p.em||i}`, tipo:"venda", ref:v, cod:`Venda #${v.numero}`, cliente:v.cliente||"Balcão", valor:Number(p.valor)||0, forma:p.forma||"", aut:p.aut||"", parcelas:p.parcelas||1, em:p.em||v.em, porNome:p.porNome||v.porNome||"", nota:!!v.notaOk&&!v.semNota})); });

/* Conferência por quinzena: dia 1 a 15 e dia 16 ao fim do mês. Lembra no Painel do chefe quando a quinzena acaba e ainda não foi conferida. */
function quinzenas(mes){ const [a,m]=mes.split("-").map(Number); const ult=new Date(a,m,0).getDate(), mm=String(m).padStart(2,"0"), nm=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][m-1];
  return [{k:mes+"-1", nome:`1ª quinzena de ${nm}`, ini:`${mes}-01`, fim:`${mes}-15`}, {k:mes+"-2", nome:`2ª quinzena de ${nm}`, ini:`${mes}-16`, fim:`${mes}-${ult}`}, {k:mes+"-m", nome:`mês de ${nm} inteiro`, ini:`${mes}-01`, fim:`${mes}-${ult}`}]; }
function quinzenaParaConferir(){ const h0=hojeISO(), mes=h0.slice(0,7), d=+h0.slice(8,10); const pm=new Date(+mes.slice(0,4), +mes.slice(5,7)-2, 1), mesAnt=`${pm.getFullYear()}-${String(pm.getMonth()+1).padStart(2,"0")}`;
  const Q = d>=16 ? quinzenas(mes)[0] : quinzenas(mesAnt)[1]; const feitas=new Set(((S.config||{}).conferenciasFeitas)||[]); if (feitas.has(Q.k)) return null;
  return Q; }
function resumoPeriodo(ini, fim){
  const dentro=t=>{ const x=new Date(t); const iso=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`; return iso>=ini && iso<=fim; };
  const C=conferirBanco(), RP=C.R.filter(r=>dentro(r.p.em));

  const pixReg=RP.filter(r=>!FORMA_CARTAO(r.p.forma) && !/dinheiro/i.test(r.p.forma)), carReg=RP.filter(r=>FORMA_CARTAO(r.p.forma)), dinReg=RP.filter(r=>/dinheiro/i.test(r.p.forma));

function conferirBanco(){

  const R=[]; const P=pagamentosParaConferir();
  // 1º passa: Pix/transferência com o mesmo valor, até 2 dias depois. Se o comprovante (ID do Pix) aparece no extrato, casa direto.
  P.forEach(p=>{ const c=conf.get(p.k.replace(/[:/]/g,"_")); let r={p, st:"", b:null, conf:c};
    if (c && c.ok) r.st="manual";

    else if (/dinheiro/i.test(p.forma)) r.st="dinheiro";

      const cart=FORMA_CARTAO(p.forma), bol=/boleto/i.test(p.forma);
      const cand = B.filter(b=>!usados.has(b.id) && Math.abs(b.valor-p.valor)<0.011 && b.t>=p.em-864e5*1.5 && b.t<=p.em+864e5*3); if (!m && cand.length>1) r.duvida=true;
      if (!m) m = B.filter(b=>!usados.has(b.id) && (cart ? (b.valor<=p.valor+0.01 && b.valor>=p.valor*0.93) : bol ? (b.valor<=p.valor+0.01 && b.valor>=p.valor-5) : Math.abs(b.valor-p.valor)<0.011) && b.t>=p.em-864e5*1.5 && b.t<=p.em+864e5*(bol?5:3)).sort((a,b)=>Math.abs(a.valor-p.valor)-Math.abs(b.valor-p.valor)||Math.abs(a.t-p.em)-Math.abs(b.t-p.em))[0];
      if (m){ usados.add(m.id); r.st="ok"; r.b=m; } else r.st = cart ? "cartao" : "falta"; }
    R.push(r); });
  const sobras = B.filter(b=>!usados.has(b.id) && b.valor>0);
  return {R, sobras, ini, fim, nBanco:B.length}; }
function pixPendentes(o){ const R=conferirBanco().R; return R.filter(r=>r.p.tipo==="os" && r.p.ref.id===o.id && /pix|transfer/i.test(r.p.forma) && !(r.st==="ok"||r.st==="manual")); }
async function liberarEntregaPix(o){ try{ await patchOS(o.id, d=>{ d.pixLiberado={em:Date.now(), porNome:me.nome, por:me.id}; addHist(d, `Chefe liberou a entrega sem esperar o Pix aparecer no extrato`); }); auditar("Banco", "Entrega "+codOS(o), {entrega:"esperando Pix"}, {entrega:"liberada pelo chefe"}); toast("✅ Entrega liberada"); }catch(err){ erro(err); } }
function lerCSVMaq(txt){ const linhas=txt.split(/\r?\n/).filter(x=>x.trim()); if (linhas.length<2) return null;
  let hi=linhas.findIndex(l=>/nsu|autoriz|valor/i.test(l)); if (hi<0) return null; const sep=(linhas[hi].match(/;/g)||[]).length>=(linhas[hi].match(/,/g)||[]).length?";":(linhas[hi].includes("\t")?"\t":",");
  const cols=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()); const H=cols(linhas[hi]).map(x=>norm(x));
  const f=re=>H.findIndex(x=>re.test(x)); const iD=f(/^data|data da venda|dt/), iV=f(/valor bruto|valor da venda|valor original|^valor$|valor \(r\$\)|valor total/), iN=f(/nsu|^doc|numero do documento|cv/), iA=f(/autoriza|cod.? aut/), iB=f(/bandeira/), iP=f(/parcela/), iL=f(/liquido/), iT=f(/^tipo|produto|modalidade|forma/);

  linhas.slice(hi+1).forEach(l=>{ const c=cols(l); const dd=c[iD]||""; const m=dd.match(/(\d{2})\/(\d{2})\/(\d{4})/); const data=m?`${m[3]}-${m[2]}-${m[1]}`:(dd.match(/\d{4}-\d{2}-\d{2}/)||[""])[0]; if (!data) return;
    const v=iV>=0?val(c[iV]):val(c[iL]); if (v==null) return; L.push({data, valor:v, liquido:iL>=0?val(c[iL]):null, nsu:iN>=0?String(c[iN]||"").replace(/\D/g,""):"", aut:iA>=0?String(c[iA]||"").trim():"", bandeira:iB>=0?c[iB]:"", parcelas:iP>=0?(parseInt(c[iP])||1):1, tipo:iT>=0?c[iT]:""}); });
  return L; }
async function importarMaquininha(file){ const L=lerCSVMaq(await file.text());

function lerOFX(txt){ const L=[]; const blocos=txt.split(/<STMTTRN>/i).slice(1);

function lerCSVBanco(txt){ const linhas=txt.split(/\r?\n/).filter(x=>x.trim()); if (linhas.length<2) return [];

  const cols=l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim()); const H=cols(linhas[0]).map(x=>norm(x));
  const iD=H.findIndex(x=>/data/.test(x)), iV=H.findIndex(x=>/valor|quantia|montante/.test(x)), iH=H.findIndex(x=>/hist|descri|lan[cç]amento|detalhe|memo/.test(x));
  if (iD<0||iV<0) return null; const L=[];
  linhas.slice(1).forEach(l=>{ const c=cols(l); const dd=c[iD]||""; let m=dd.match(/(\d{2})\/(\d{2})\/(\d{4})/), data=m?`${m[3]}-${m[2]}-${m[1]}`:(dd.match(/\d{4}-\d{2}-\d{2}/)||[""])[0]; if (!data) return;
    let vs=(c[iV]||"").replace(/[R$\s]/g,""); vs = vs.includes(",") ? vs.replace(/\./g,"").replace(",",".") : vs; const v=parseFloat(vs); if (isNaN(v)) return;

  return L; }

function periodoHG(k){ const d=new Date(), iso=x=>isoDe(x.getTime());

  if (k==="7d"){ const a=new Date(d); a.setDate(a.getDate()-6); return [iso(a), iso(d)]; }

  if (k==="ano") return [iso(new Date(d.getFullYear(),0,1)), iso(d)];
}

async function carregarHG(){
  const ini = new Date(UI.hgIni+"T00:00:00").getTime(), fim = new Date(UI.hgFim+"T23:59:59").getTime(), chave = ini+":"+fim;
  if (HG.chave===chave && HG.dados) return HG.dados;
  if (HG.carregando===chave) return null;
  HG.carregando = chave;
  const naFaixa = (t)=> t>=ini && t<=fim;
  const pega = async (col, campo)=>{ try{ const sn = await db.collection(col).where(campo,">=",ini).where(campo,"<=",fim).orderBy(campo,"desc").limit(1000).get(); return sn.docs.map(d=>Object.assign({id:d.id}, d.data())).filter(x=>naFaixa(x[campo])); }catch(e){ console.error(col,e); return null; } };
  const [mov, ven, os] = await Promise.all([pega("movimentos","em"), pega("vendas","em"), pega("os","prontaEm")]);
  HG.dados = {mov: mov||S.movimentos.filter(m=>naFaixa(m.em)), ven: ven||S.vendas.filter(v=>naFaixa(v.em)), os: (os||S.os.filter(o=>naFaixa(o.prontaEm))).filter(o=>["pronta","entregue"].includes(o.status)), cheio: [mov,ven,os].some(x=>x&&x.length>=1000)};
  HG.chave = chave; HG.carregando = false; return HG.dados;
}
